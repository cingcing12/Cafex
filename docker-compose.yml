version: '3.8'

services:
  # 1.1 Database (MongoDB)
  db:
    image: mongo:latest
    container_name: db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db

  # 1.2 Backend (Node.js)
  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Assuming you want to use the local docker MongoDB instead of Atlas:
      - MONGO_URI=mongodb://root:rootpassword@db:27017/DB-eccomerce?authSource=admin
      # Leave existing Cloudinary / API tokens here, you may want to move them to .env and use env_file
    env_file:
      - ./backend/.env
    depends_on:
      - db

  # 1.3 Frontend (Vue.js + Nginx)
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Nginx Proxy Manager
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt

volumes:
  db_data:
